<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>PDF 双语对照 · 设置</title>
    <style>
      :root {
        --line: #e3e2dd;
        --dim: #6f6f6a;
        --accent: #2f6f4f;
        --warn: #b4453a;
      }
      body {
        margin: 0;
        padding: 40px 24px;
        font: 14px/1.7 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #fbfbfa;
        color: #1c1c1a;
      }
      .wrap {
        max-width: 560px;
        margin: 0 auto;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      .sub {
        color: var(--dim);
        font-size: 13px;
        margin: 0 0 28px;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin: 18px 0 6px;
        letter-spacing: 0.02em;
      }
      input {
        width: 100%;
        padding: 9px 11px;
        font: inherit;
        font-size: 13px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fff;
        box-sizing: border-box;
      }
      input:focus {
        outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent);
        border-color: var(--accent);
      }
      .hint {
        font-size: 12px;
        color: var(--dim);
        margin: 6px 0 0;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 26px;
      }
      button {
        font: inherit;
        font-size: 13px;
        padding: 8px 18px;
        border-radius: 7px;
        border: 1px solid var(--line);
        background: #fff;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: #fff;
        border-color: transparent;
      }
      #msg {
        font-size: 13px;
        margin-left: 4px;
      }
      #msg.ok {
        color: var(--accent);
      }
      #msg.err {
        color: var(--warn);
      }
      .foot {
        margin-top: 34px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        font-size: 12px;
        color: var(--dim);
        line-height: 1.9;
      }
      code {
        background: #eee;
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>PDF 双语对照</h1>
      <p class="sub">用自己的 OpenAI 兼容接口翻译，译文只存在本机。</p>

      <label for="baseUrl">接口地址（Base URL）</label>
      <input id="baseUrl" spellcheck="false" placeholder="https://api.deepseek.com/v1" />
      <p class="hint">填到 <code>/v1</code> 为止即可，程序自动拼 <code>/chat/completions</code>。</p>

      <label for="apiKey">API Key</label>
      <input id="apiKey" type="password" spellcheck="false" placeholder="sk-..." />

      <label for="model">模型</label>
      <input id="model" spellcheck="false" placeholder="deepseek-chat" />

      <div class="row">
        <button class="primary" id="save">保存</button>
        <button id="test">测试连接</button>
        <span id="msg"></span>
      </div>

      <div class="foot">
        用法：在浏览器里打开任意 PDF，点工具栏的扩展图标（或按 <code>Alt+Shift+T</code>），
        就会在新标签页里打开双语对照阅读器。<br />
        也可以把 PDF 文件直接拖进阅读器窗口。<br />
        API Key 保存在扩展的 <code>chrome.storage.local</code>，未加密，不会上传到任何第三方。
      </div>
    </div>
    <script type="module" src="options.js"></script>
  </body>
</html>
